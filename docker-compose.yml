# Local development only: these credentials never go to production (RNF-SEG-05).

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: atelie_afro
      MYSQL_USER: atelie
      MYSQL_PASSWORD: atelie-dev
      MYSQL_ROOT_PASSWORD: root-dev
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uatelie", "-patelie-dev", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      target: dev
    command: sh -c "npm run db:migrate && npm run db:seed && npm run dev"
    environment:
      NODE_ENV: development
      PORT: 3333
      CORS_ORIGINS: http://localhost:5173
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: atelie_afro
      DB_USER: atelie
      DB_PASSWORD: atelie-dev
      JWT_SECRET: chave-de-desenvolvimento-local-nao-usar-em-producao
      JWT_EXPIRES_IN: 1h
    ports:
      - "3333:3333"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_URL: http://localhost:3333/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql-data:
