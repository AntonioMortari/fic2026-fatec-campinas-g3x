<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F9F4EA" />
    <meta name="description" content="Espaço educativo de criação, reflexão e valorização da cultura e memória afro brasileira, na Casa Verde, zona norte de São Paulo." />
    <title>Ateliê Afro Cultural</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/bitter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Applies the saved reading preferences before first paint to avoid a flash at the default size.
      try {
        var step = localStorage.getItem('af-font')
        if (step && /^(-1|[1-3])$/.test(step)) document.documentElement.setAttribute('data-font-scale', step)
        if (localStorage.getItem('af-contrast') === 'high') document.documentElement.setAttribute('data-contrast', 'high')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
